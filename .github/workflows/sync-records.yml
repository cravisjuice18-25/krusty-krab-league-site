name: Sync Hall of Records
run-name: Hall of Records sync (${{ github.event_name }})

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_records.py
      - .github/workflows/sync-records.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: hall-of-records-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate and sync sheet data
        run: python3 scripts/sync_records.py
      - name: Commit changed website data
        run: |
          git config user.name "KKL Records Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/sync-status.json
          if git diff --cached --quiet; then
            echo "Hall of Records is already current."
            exit 0
          fi
          git commit -m "Sync Hall of Records website data"
          git push origin HEAD:main
      - name: Open or update sync failure alert
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search 'KKL automatic records sync failed in:title' --json number --jq '.[0].number // empty')
          details="The scheduled Hall of Records sync failed. Check the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) and fix the source or validation problem. Do not assume the website is current."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$details"
          else
            gh issue create --title 'KKL automatic records sync failed' --body "$details"
          fi
      - name: Resolve sync failure alert after success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search 'KKL automatic records sync failed in:title' --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment 'The records sync workflow completed successfully. Verify data freshness in data/sync-status.json.'
          done
